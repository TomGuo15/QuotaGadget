name: Windows CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build -c Release -warnaserror
      - run: dotnet test -c Release --no-build --filter "Category!=Interactive"
      - run: dotnet publish src/QuotaGadget -c Release -r win-x64 -o dist -warnaserror
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: win-x64
          path: dist/QuotaGadget.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: win-x64
          path: dist
      - name: Publish executable and SHA-256 checksum
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: |
          $hash = (Get-FileHash QuotaGadget.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  QuotaGadget.exe" | Set-Content -Encoding ascii SHA256SUMS.txt
          gh release create "$env:GITHUB_REF_NAME" QuotaGadget.exe SHA256SUMS.txt --verify-tag --title "$env:GITHUB_REF_NAME" --notes-from-tag
